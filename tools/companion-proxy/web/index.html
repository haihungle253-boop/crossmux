<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>读书搭子</title>
<style>
  :root {
    --bg: #faf8f4; --panel: #fff; --ink: #23201c; --muted: #7c7568;
    --line: #e5dfd4; --accent: #6b5b47; --mine: #efeae0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18160f; --panel: #211e18; --ink: #ece7dd; --muted: #948b7c;
      --line: #322d24; --accent: #c8b492; --mine: #2b2721;
    }
  }
  * { box-sizing: border-box; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.7 -apple-system, "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 12px 16px calc(12px + env(safe-area-inset-top)) 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 2;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .02em; }
  #where { margin-top: 3px; font-size: 13px; color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .turn { margin-bottom: 18px; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bubble {
    padding: 11px 14px; border-radius: 14px; white-space: pre-wrap;
    word-break: break-word; background: var(--panel); border: 1px solid var(--line);
  }
  .me .bubble { background: var(--mine); }
  .me { margin-left: 15%; }
  .tag {
    font-size: 11px; border: 1px solid var(--line); border-radius: 999px;
    padding: 0 6px; margin-left: 6px; color: var(--muted);
  }
  footer {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
    border-top: 1px solid var(--line); background: var(--panel);
  }
  textarea {
    flex: 1; resize: none; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    max-height: 30dvh; min-height: 44px;
  }
  button {
    font: inherit; border: 0; border-radius: 12px; padding: 0 18px;
    background: var(--accent); color: var(--bg); font-weight: 600;
  }
  button:disabled { opacity: .45; }
  .notice { color: var(--muted); font-size: 14px; text-align: center; padding: 28px 16px; }
  .error { color: #b4442c; }
  @media (prefers-color-scheme: dark) { .error { color: #e08b72; } }
</style>
</head>
<body>
<header>
  <h1>读书搭子</h1>
  <div id="where">连接中……</div>
</header>

<div id="log"><div class="notice">正在载入……</div></div>

<footer>
  <textarea id="input" rows="1" placeholder="说点什么……" enterkeyhint="send"></textarea>
  <button id="send">发送</button>
</footer>

<script>
const $log = document.getElementById('log');
const $input = document.getElementById('input');
const $send = document.getElementById('send');
const $where = document.getElementById('where');

// The token is the same one the reader carries. Kept in localStorage so it is
// asked for once per phone, not once per visit.
let token = localStorage.getItem('companionToken') || '';
let book = '_unknown';

function ensureToken() {
  if (token) return true;
  const entered = prompt('请输入访问令牌（和墨水屏 SD 卡上填的那个一样）');
  if (!entered) return false;
  token = entered.trim();
  localStorage.setItem('companionToken', token);
  return true;
}

function headers(extra) {
  return Object.assign({ 'Authorization': 'Bearer ' + token }, extra || {});
}

function addTurn(who, text, source) {
  const turn = document.createElement('div');
  turn.className = 'turn' + (who === 'me' ? ' me' : '');
  const label = document.createElement('div');
  label.className = 'who';
  label.textContent = who === 'me' ? '我' : '搭子';
  // Where a turn happened matters: it is the visible proof that the two
  // surfaces share one conversation.
  if (source === 'reader') {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = '墨水屏';
    label.appendChild(tag);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  turn.append(label, bubble);
  $log.appendChild(turn);
  $log.scrollTop = $log.scrollHeight;
  return bubble;
}

function notice(text, isError) {
  $log.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'notice' + (isError ? ' error' : '');
  div.textContent = text;
  $log.appendChild(div);
}

async function loadState() {
  if (!ensureToken()) { notice('需要令牌才能使用', true); return; }
  try {
    const res = await fetch('/api/state', { headers: headers() });
    if (res.status === 401) {
      localStorage.removeItem('companionToken'); token = '';
      notice('令牌不对，刷新页面重新输入', true); return;
    }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const state = await res.json();
    book = state.book;

    const p = state.position || {};
    $where.textContent = p.book
      ? [p.book, p.chapter, p.progress].filter(Boolean).join(' · ')
      : '墨水屏还没报告过进度';

    $log.innerHTML = '';
    if (!state.history.length) {
      notice('还没有聊过。说点什么吧。');
    } else {
      for (const entry of state.history) {
        addTurn('me', entry.question, entry.source);
        addTurn('them', entry.reply, entry.source);
      }
    }
  } catch (err) {
    notice('连不上代理：' + err.message, true);
  }
}

async function send() {
  const text = $input.value.trim();
  if (!text || $send.disabled) return;
  $input.value = ''; $input.style.height = 'auto';
  $send.disabled = true;

  if ($log.querySelector('.notice')) $log.innerHTML = '';
  addTurn('me', text);
  const bubble = addTurn('them', '……');
  let reply = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ message: text, book: book })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, cut).trim();
        buffer = buffer.slice(cut + 1);
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (!payload || payload === '[DONE]') continue;
        let parsed;
        try { parsed = JSON.parse(payload); } catch { continue; }
        if (parsed.error) { throw new Error(parsed.error.message || '上游出错'); }
        const piece = parsed.choices && parsed.choices[0]
          && parsed.choices[0].delta && parsed.choices[0].delta.content;
        // Unlike the e-ink panel, a phone can afford to paint every token.
        if (piece) { reply += piece; bubble.textContent = reply; $log.scrollTop = $log.scrollHeight; }
      }
    }
    if (!reply) bubble.textContent = '（没有回复）';
  } catch (err) {
    bubble.textContent = '出错了：' + err.message;
    bubble.classList.add('error');
  } finally {
    $send.disabled = false;
    $input.focus();
  }
}

$send.addEventListener('click', send);
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, window.innerHeight * 0.3) + 'px';
});
$input.addEventListener('keydown', (e) => {
  // Enter sends; Shift-Enter makes a new line. On a phone keyboard the send
  // key lands here too.
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// Coming back to the tab is the moment a reader-side conversation would be new.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !$send.disabled) loadState();
});

loadState();
</script>
</body>
</html>
